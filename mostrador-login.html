<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PizzaGo | Acceso Administrador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/mostrador-login.css">
</head>
<body>

  <header class="ml-topbar flex items-center justify-between">
    <div class="ml-logo">
      <div class="ml-logo-icon">🍕</div>
      <span>PizzaGo</span>
    </div>
    <a href="./inicio.html" class="ml-support-btn">← Acceso clientes</a>
  </header>

  <main class="ml-main flex items-center justify-center flex-1">
    <div class="ml-card">
      <div class="ml-card-img">
        <img src="img/pizza.png" alt="Pizza">
        <div class="ml-card-img-overlay"></div>
      </div>
      <div class="ml-card-header">
        <h2>Admin Access</h2>
        <p>Panel de gestión de pedidos para mostrador y cocina</p>
      </div>
      <form id="mostradorLoginForm" class="ml-form">
        <div class="ml-field">
          <label>Staff ID o Correo</label>
          <div class="ml-input-wrap">
            <span class="ml-icon">👤</span>
            <input type="text" id="usuarioMostrador" placeholder="admin@pizzago.com o EMP-001" autocomplete="username">
          </div>
        </div>
        <div class="ml-field">
          <div class="ml-label-row"><label>Contraseña</label></div>
          <div class="ml-input-wrap">
            <span class="ml-icon">🔒</span>
            <input type="password" id="passwordMostrador" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="ml-eye" onclick="mlTogglePass()">👁</button>
          </div>
        </div>
        <button type="submit" class="ml-btn w-full font-bold tracking-wide transition-all">Entrar al Panel ⇒</button>
        <p id="mensajeMostrador" class="ml-mensaje"></p>
      </form>
      <p class="ml-aviso text-center text-xs">Solo personal autorizado. Los accesos son registrados y monitoreados por seguridad.</p>
      <div class="ml-card-footer-links">
        <a href="#">Política de privacidad</a>
        <a href="#">Términos de servicio</a>
      </div>
    </div>
  </main>

  <footer class="ml-footer">© 2025 PizzaGo Management System. All rights reserved.</footer>

  <script src="js/supabase.js"></script>
  <script src="js/mostrador-login.js"></script>
</body>
</html>
